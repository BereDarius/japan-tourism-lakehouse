
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "japan-tourism-lakehouse"
version = "0.1.0"
description = "An end-to-end tourism analytics lakehouse for Japan."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "databricks-connect>=17.3,<17.4",
    "pyright>=1.1,<2.0",
    "import-linter>=2.0,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    ".venv",
    "build",
    "dist",
]

[tool.importlinter]
root_package = "japan_tourism"

[[tool.importlinter.contracts]]
name = "Hexagonal Architecture Dependency Rules"
type = "layers"
containers = ["japan_tourism"]
layers = [
    "infrastructure",
    "application",
    "domain",
]
